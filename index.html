<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Online Image Compressor - Reduce PNG & JPG Size Without Losing Quality</title>
<meta name="description" content="Compress PNG, JPG, and WebP images instantly with our free online image compressor. Reduce file size without losing quality directly in your browser.">
<meta name="keywords" content="image compressor, reduce image size, compress png, compress jpg, online image optimizer, photo size reducer">
    <title>ProCompressor - Fast & Free Image Optimizer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { background: #ffffff; width: 100%; max-width: 520px; border-radius: 20px; padding: 35px; box-shadow: 0 20px 40px rgba(0,0,0,0.15); text-align: center; }
        .card h1 { font-size: 26px; color: #1e293b; font-weight: 700; margin-bottom: 8px; }
        .card p { color: #64748b; font-size: 14px; margin-bottom: 25px; }
        
        .upload-area { border: 2px dashed #cbd5e1; border-radius: 14px; padding: 35px 20px; cursor: pointer; transition: all 0.3s ease; background: #f8fafc; margin-bottom: 20px; }
        .upload-area:hover { border-color: #6366f1; background: #eeeffe; }
        .upload-icon { font-size: 40px; color: #6366f1; margin-bottom: 10px; }
        .upload-text { font-size: 15px; color: #334155; font-weight: 600; }
        .upload-hint { font-size: 12px; color: #94a3b8; margin-top: 4px; }
        input[type="file"] { display: none; }
        
        .file-info { display: none; background: #f1f5f9; padding: 12px 16px; border-radius: 10px; font-size: 13px; color: #334155; font-weight: 500; margin-bottom: 20px; text-align: left; word-break: break-all; }
        
        .controls { margin-bottom: 25px; text-align: left; }
        .label-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; font-weight: 600; color: #475569; }
        input[type="range"] { width: 100%; height: 6px; background: #e2e8f0; border-radius: 5px; outline: none; border: none; accent-color: #6366f1; cursor: pointer; }
        
        .btn { width: 100%; padding: 14px; border: none; border-radius: 12px; background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4); }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6); }
        .btn:active { transform: translateY(0); }
    </style>
</head>
<body>

    <div class="card">
        <h1>Image Compressor Pro</h1>
        <p>Compress your PNG and JPG images effortlessly without losing quality.</p>
        
        <div class="upload-area" id="dropArea">
            <div class="upload-icon">📁</div>
            <div class="upload-text">Click or Drag & Drop image here</div>
            <div class="upload-hint">Supports PNG, JPG, JPEG, WEBP</div>
            <input type="file" id="fileInput" accept="image/*">
        </div>

        <div class="file-info" id="fileInfo">Selected: <span id="fileName" style="color:#6366f1; font-weight:700;"></span></div>

        <div class="controls">
            <div class="label-row">
                <span>Compression Quality</span>
                <span id="qualityVal">80%</span>
            </div>
            <input type="range" id="quality" min="10" max="100" value="80">
        </div>

        <button class="btn" id="compressBtn">Compress & Download</button>
    </div>

    <script>
        const dropArea = document.getElementById('dropArea');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const qualityInput = document.getElementById('quality');
        const qualityVal = document.getElementById('qualityVal');
        const compressBtn = document.getElementById('compressBtn');

        dropArea.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', handleFile);

        dropArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropArea.style.borderColor = '#6366f1';
        });

        dropArea.addEventListener('dragleave', () => {
            dropArea.style.borderColor = '#cbd5e1';
        });

        dropArea.addEventListener('drop', (e) => {
            e.preventDefault();
            dropArea.style.borderColor = '#cbd5e1';
            if (e.dataTransfer.files.length) {
                fileInput.files = e.dataTransfer.files;
                handleFile();
            }
        });

        function handleFile() {
            if (fileInput.files.length > 0) {
                fileName.textContent = fileInput.files[0].name;
                fileInfo.style.display = 'block';
            }
        }

        qualityInput.addEventListener('input', (e) => {
            qualityVal.textContent = `${e.target.value}%`;
        });

        compressBtn.addEventListener('click', () => {
            if (!fileInput.files || fileInput.files.length === 0) {
                alert('Pehle koi image upload karein!');
                return;
            }

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.readAsDataURL(file);
            reader.onload = function(event) {
                const img = new Image();
                img.src = event.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');

                    canvas.width = img.width;
                    canvas.height = img.height;

                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                    const quality = qualityInput.value / 100;
                    const dataUrl = canvas.toDataURL('image/jpeg', quality);

                    const link = document.createElement('a');
                    link.href = dataUrl;
                    link.download = 'compressed-' + file.name;
                    link.click();
                }
            }
        });
    </script>

</body>

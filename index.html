<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast Image Compressor & Resizer</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { background: #fff; border-radius: 8px; padding: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 500px; width: 100%; }
        h2 { margin-bottom: 20px; color: #333; }
        input[type="file"] { margin: 15px 0; }
        .controls { margin: 15px 0; }
        label { font-size: 14px; font-weight: bold; display: block; margin-bottom: 5px; }
        input[type="range"] { width: 100%; }
        button { background: #0070f3; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; width: 100%; font-size: 16px; margin-top: 15px; }
        button:hover { background: #0051a2; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Image Compressor</h2>
        <input type="file" id="upload" accept="image/*">
        <div class="controls">
            <label id="qualityLabel">Quality (80%):</label>
            <input type="range" id="quality" min="10" max="100" value="80">
        </div>
        <button id="compress">Compress Image</button>
    </div>

    <script>
        const upload = document.getElementById('upload');
        const qualityInput = document.getElementById('quality');
        const qualityLabel = document.getElementById('qualityLabel');
        const compressBtn = document.getElementById('compress');

        qualityInput.addEventListener('input', (e) => {
            qualityLabel.innerText = `Quality (${e.target.value}%):`;
        });

        compressBtn.addEventListener('click', () => {
            if (!upload.files || upload.files.length === 0) {
                alert('Pehle koi image select karein!');
                return;
            }

            const file = upload.files[0];
            const reader = new FileReader();

            reader.readAsDataURL(file);
            reader.onload = function(event) {
                const img = new Image();
                img.src = event.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');

                    canvas.width = img.width;
                    canvas.height = img.height;

                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                    const quality = qualityInput.value / 100;
                    const dataUrl = canvas.toDataURL('image/jpeg', quality);

                    const link = document.createElement('a');
                    link.href = dataUrl;
                    link.download = 'compressed-' + file.name;
                    link.click();
                }
            }
        });
    </script>
</body>
</html>
